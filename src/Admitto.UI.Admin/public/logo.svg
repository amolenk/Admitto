<svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Admitto">
  <defs>
    <linearGradient id="admittoTicket" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b6fd6"/>
    </linearGradient>
    <mask id="admittoNotches">
      <rect x="0" y="0" width="28" height="28" rx="8" fill="white"/>
      <circle cx="0" cy="14" r="3" fill="black"/>
      <circle cx="28" cy="14" r="3" fill="black"/>
    </mask>
  </defs>

  <!-- Ticket body with punched side notches -->
  <rect x="0" y="0" width="28" height="28" rx="8" fill="url(#admittoTicket)" mask="url(#admittoNotches)"/>
  <rect x="0.5" y="0.5" width="27" height="27" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.2" mask="url(#admittoNotches)"/>

  <!-- Barcode -->
  <g transform="translate(7 7) scale(0.5833)" stroke="#eef2ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8v8M8 6v12M12 6v12M16 6v12M20 8v8"/>
  </g>
</svg>
